# Pins every Robolectric test in this module to API 34, independent of the
# app's real compileSdk/targetSdk (36). Robolectric's simulated SDK for unit
# tests does not need to track the app's production target - it only needs
# to match a version the pinned Robolectric artifact (4.13) actually ships
# shadows for. Without this, Robolectric defaults to reading targetSdkVersion
# from the merged manifest (now 36), which 4.13 doesn't support and fails
# every test with "Robolectric does not support API level 36" before any
# actual test code runs. Upgrading Robolectric itself to a version with API
# 36 support additionally requires JDK 21 for that specific SDK - a much
# larger, unrelated toolchain change not worth bundling into this SDK bump.
sdk=34
