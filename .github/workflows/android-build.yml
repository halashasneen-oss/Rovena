name: Android CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  domain-tests:
    name: Domain module unit tests (pure Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run domain unit tests
        run: ./gradlew :domain:test --stacktrace

      - name: Upload domain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-results
          path: domain/build/test-results/test/

  android-build:
    name: Build Android app (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        # ubuntu-latest GitHub-hosted runners ship with the Android SDK and
        # cmdline-tools/sdkmanager pre-installed at $ANDROID_HOME already -
        # this just ensures the exact compileSdk/build-tools versions this
        # project targets are present.
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run app unit tests
        run: ./gradlew :app:testDevDebugUnitTest --stacktrace

      - name: Lint (dev debug)
        run: ./gradlew :app:lintDevDebug --stacktrace
        continue-on-error: true

      - name: Assemble debug APK (dev flavor)
        run: ./gradlew :app:assembleDevDebug --stacktrace

      - name: Decode release keystore (only if the secret is configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ROVENA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ROVENA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ROVENA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ROVENA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
            echo "ROVENA_KEYSTORE_PATH=/tmp/release.jks" >> "$GITHUB_ENV"
            echo "ROVENA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ROVENA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ROVENA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret configured - release build will be unsigned."
          fi

      - name: Assemble release APK (prod flavor, unsigned unless a keystore secret is configured)
        run: ./gradlew :app:assembleProdRelease --stacktrace

      - name: Assemble release AAB (prod flavor)
        run: ./gradlew :app:bundleProdRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rovena-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: rovena-prod-release-apk
          path: app/build/outputs/apk/prod/release/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: rovena-prod-release-aab
          path: app/build/outputs/bundle/prodRelease/*.aab

      - name: Upload app unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: app/build/test-results/

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-devDebug.html
