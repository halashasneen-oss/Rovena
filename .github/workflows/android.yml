name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Test, build, lint and bundle release
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:assembleDebug \
            :app:lintDebug \
            :app:lintRelease \
            :app:bundleRelease \
            --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rovena2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: rovena-auto-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
