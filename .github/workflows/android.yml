name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already includes cmdline-tools; the old setup action
      # attempted to install the removed legacy "tools" package and failed.
      - name: Install Android 36
        run: |
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/android-cli.zip"
          echo "2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  $RUNNER_TEMP/android-cli.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
          mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Prepare release signing key
        env:
          ROVENA_KEYSTORE_BASE64: ${{ secrets.ROVENA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ROVENA_KEYSTORE_BASE64" ]; then
            printf '%s' "$ROVENA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rovena-upload-key.jks"
            echo "ROVENA_KEYSTORE_PATH=$RUNNER_TEMP/rovena-upload-key.jks" >> "$GITHUB_ENV"
            echo "ROVENA_SIGNING_READY=true" >> "$GITHUB_ENV"
          else
            echo "ROVENA_SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Test, build, lint and bundle release
        env:
          ROVENA_STORE_PASSWORD: ${{ secrets.ROVENA_STORE_PASSWORD }}
          ROVENA_KEY_ALIAS: ${{ secrets.ROVENA_KEY_ALIAS }}
          ROVENA_KEY_PASSWORD: ${{ secrets.ROVENA_KEY_PASSWORD }}
          ROVENA_ADMOB_APP_ID: ${{ secrets.ROVENA_ADMOB_APP_ID }}
          ROVENA_ADMOB_BANNER_ID: ${{ secrets.ROVENA_ADMOB_BANNER_ID }}
          ROVENA_ADMOB_INTERSTITIAL_ID: ${{ secrets.ROVENA_ADMOB_INTERSTITIAL_ID }}
          ROVENA_ADMOB_REWARDED_ID: ${{ secrets.ROVENA_ADMOB_REWARDED_ID }}
        run: |
          if [ -n "$ROVENA_ADMOB_APP_ID" ] && [ -n "$ROVENA_ADMOB_BANNER_ID" ] && [ -n "$ROVENA_ADMOB_INTERSTITIAL_ID" ] && [ -n "$ROVENA_ADMOB_REWARDED_ID" ]; then
            echo "ROVENA_LIVE_ADS_READY=true" >> "$GITHUB_ENV"
            echo "Rovena AdMob: complete production credentials supplied"
          else
            echo "ROVENA_LIVE_ADS_READY=false" >> "$GITHUB_ENV"
            echo "::warning::Rovena production AdMob IDs absent. Release builds but AD REQUESTS ARE DISABLED."
          fi
          chmod +x gradlew
          ./gradlew \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:assembleDebug \
            :app:lintDebug \
            :app:lintRelease \
            :app:bundleRelease \
            --stacktrace

      - name: Verify signed release AAB
        if: env.ROVENA_SIGNING_READY == 'true'
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rovena2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release AAB with live AdMob
        if: env.ROVENA_SIGNING_READY == 'true' && env.ROVENA_LIVE_ADS_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rovena-signed-aab-admob-live
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed AAB without live ads (not for launch)
        if: env.ROVENA_SIGNING_READY == 'true' && env.ROVENA_LIVE_ADS_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rovena-signed-aab-ads-disabled
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload unsigned release AAB
        if: env.ROVENA_SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rovena-auto-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
